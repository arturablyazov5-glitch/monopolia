services:
  leads:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      TRUST_PROXY: 0
      DATA_DIR: /data
    volumes:
      - catalog:/data
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  catalog:
