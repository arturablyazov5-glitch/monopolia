<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="602" viewBox="0 0 1024 602" preserveAspectRatio="none">
  <style>
    /* The photo stretches to its frame. Preserve the original logo proportions
       using the SVG image viewport, including when object-fit switches to cover. */
    .screen-brand {
      transform-origin: 20px 30.5px;
      transform: scaleX(calc(1024 / 602 * (100vh / 100vw)));
    }
    .contact-shadow { opacity: 0; }

    @media (prefers-reduced-motion: no-preference) {
      .note { animation: count 2s linear infinite; }
      .contact-shadow { animation: contact 2s linear infinite; }
      .note-one, .shadow-one { animation-delay: -1.5s; }
      .note-two, .shadow-two { animation-delay: -1s; }
      .note-three, .shadow-three { animation-delay: -.5s; }
      .foil { animation: foil 2s ease-in-out infinite; }
      .indicator { animation: pulse .5s ease-in-out infinite; }
      .indicator.second { animation-delay: -.1666667s; }
      .indicator.third { animation-delay: -.3333333s; }
    }
    @keyframes count {
      0% {
        transform: translateY(-32px) scale(.96, .94);
        opacity: 0;
        animation-timing-function: ease-out;
      }
      6% {
        transform: translateY(-27px) scale(.98, .96);
        opacity: 1;
        animation-timing-function: cubic-bezier(.32, 0, .2, 1);
      }
      20% { transform: translateY(0) scale(1); opacity: 1; }
      25% { transform: translateY(1px) scale(1); opacity: 1; }
      32%, 100% { transform: translateY(3px) scale(1); opacity: 0; }
    }
    @keyframes contact {
      0%, 6% { opacity: 0; transform: scale(.88, 1); }
      16% { opacity: .16; transform: scale(.98, 1); }
      20%, 25% { opacity: .28; transform: scale(1); }
      32%, 100% { opacity: 0; transform: scale(1); }
    }
    @keyframes foil {
      0%, 65%, 100% { opacity: .15; }
      32% { opacity: .7; }
    }
    @keyframes pulse {
      0%, 80%, 100% { opacity: .25; }
      35% { opacity: 1; }
    }
  </style>
  <!-- The transparent canvas shares the photo's intrinsic size and crop. -->
